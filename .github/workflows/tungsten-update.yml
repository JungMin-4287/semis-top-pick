name: Update Foosung materials tracker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tungsten-update.yml'
      - 'foosung-tracker/collector.py'
  schedule:
    - cron: '25 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: foosung-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 feedparser==6.0.11
      - name: Collect data
        run: python foosung-tracker/collector.py
      - name: Commit data
        run: |
          git config user.name "foosung-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foosung-tracker/data.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: update Foosung materials tracker"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push; then
              exit 0
            fi
            echo "Push raced with another updater; retry $i/5"
            sleep 5
          done
          echo "Failed to push after retries"
          exit 1
